name: Full CI Pipeline (Quality + Tests)

on: [push, pull_request]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python (связь с Неделей 1)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Advanced pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install + Lint (как в Неделе 2 + 7.1)
        run: |
          pip install -r requirements.txt black flake8 isort mypy
          black --check .
          flake8 .
          isort --check-only .
          mypy tests/ --strict

  test-ui-api:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip + Playwright (advanced)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
      
      - name: Install everything
        run: |
          pip install -r requirements.txt
          pip install allure-pytest pytest-xdist
          playwright install --with-deps chromium
      
      - name: Run tests (с Allure + hooks из 7.2.1)
        run: pytest -n auto --alluredir=reports/allure
      
      - name: Upload artifact (связь с практикой Недели 1)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-python${{ matrix.python-version }}
          path: reports/allure
          retention-days: 30