[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \venv
  | build
  | dist
  | \.vscode
  | .env
  | \.pytest_cache
)/
'''

[tool.mypy]
exclude = [
    "lab_work\\.py$",
    "lab_work2\\.py$",
    "loops_practice\\.py$"
]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"] 
disable_error_code = ["untyped-decorator"]