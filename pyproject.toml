[tool.pytest.ini_options]
addopts = "-ra --alluredir=reports/allure --reruns 2 --reruns-delay 1"
markers = [
    "smoke : быстрые smoke-тесты",
    "ui : UI тесты",
    "api : API тесты",
    "mocked : замокированные API тесты",
    "integration : API тесты, которые ходят в сеть"
]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \venv
  | build
  | dist
  | \.vscode
  | .env
  | \.pytest_cache
)/
'''

[tool.mypy]
exclude = [
    "lab_work\\.py$",
    "lab_work2\\.py$",
    "loops_practice\\.py$"
]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "pages.*"] 
disable_error_code = ["untyped-decorator"]